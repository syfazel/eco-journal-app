# Cloud debug build for the ECO JOURNAL app (Phase 1).
# No secrets, no signing, no Firebase keys: this builds a DEBUG apk
# only. Release signing is a separate, later decision by Yasin.
# Layout assumption: the CONTENTS of the lab's app/ folder are the
# repo root (settings.gradle.kts at the root, :app module under app/).
# If instead the whole app/ folder is pushed as a subdirectory, set
# working-directory: app and path: app/app/build/... accordingly.
name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Shared debug signing (fix for the 2026-10-25 install failure):
      # every ephemeral runner used to generate its own Android Debug
      # keystore, so each cloud APK had a different signature and
      # Android refused to update over the previous one. All builds
      # now share ONE keystore, stored only as a GitHub secret (never
      # committed — *.keystore is gitignored). The keystore itself is
      # a debug key with the standard Android debug credentials.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eco-journal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

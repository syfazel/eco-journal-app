# Cloud debug build for the ECO JOURNAL app (Phase 1).
# No secrets, no signing, no Firebase keys: this builds a DEBUG apk
# only. Release signing is a separate, later decision by Yasin.
# Layout assumption: the CONTENTS of the lab's app/ folder are the
# repo root (settings.gradle.kts at the root, :app module under app/).
# If instead the whole app/ folder is pushed as a subdirectory, set
# working-directory: app and path: app/app/build/... accordingly.
name: Android debug build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Shared debug signing (fix for the 2026-10-25 install failure):
      # every ephemeral runner used to generate its own Android Debug
      # keystore, so each cloud APK had a different signature and
      # Android refused to update over the previous one. All builds
      # now share ONE keystore, stored only as a GitHub secret (never
      # committed — *.keystore is gitignored). The keystore itself is
      # a debug key with the standard Android debug credentials.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: eco-journal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # v5.2 update gate (audit U-01 / T7), kept for 5.4:
      # verify version.json against the APK just built.
      # version_manifest.py reads the version from
      # app/build.gradle.kts, so a mismatch fails the run here
      # instead of surfacing as a hash_mismatch on the phone. The
      # step runs AFTER the upload on purpose: on the first 5.4
      # pass version.json still names 5.3.0/9, so the verify fails
      # (gate working as designed) — but the APK is already
      # uploaded, which is what Phase 5 needs to generate the
      # real 5.4 version.json from. Once version.json names
      # 5.4.0/10 with the real APK hash, this step passes.
      #
      # TWO CHECKS, NOT ONE (D18 — DEX non-determinism, proven
      # by runs 44183915798 vs 44185080944: same source, same
      # size, only classes.dex +4B and classes7.dex +8B differ):
      #  1. hash check against the COMMITTED APK, which is the
      #     exact file Pages serves at the manifest apk_url —
      #     this is the real update-safety invariant;
      #  2. identity-only check of the FRESHLY BUILT APK
      #     (package/versionName/versionCode via aapt) — its
      #     hash is NOT comparable, because a rebuild from the
      #     same source is not byte-identical.
      - name: Verify version manifest against served APK
        run: python3 edge/version_manifest.py verify --apk edge/out/app-debug-v5.4.apk

      - name: Verify freshly built APK identity
        run: python3 edge/version_manifest.py verify --apk app/build/outputs/apk/debug/app-debug.apk --identity-only

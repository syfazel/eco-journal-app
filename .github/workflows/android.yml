# ECO JOURNAL — Yemen only, v6.0.0/code 13 (Flutter rebuild).
# Builds the debug APK and signs it with the ONE shared debug keystore
# (restored from the DEBUG_KEYSTORE_BASE64 secret), exactly as the 5.6
# Kotlin app did. The certificate fingerprint MUST be
# 45220b1509e14db5fd9a8e42220547ea94da48bdc4a4ccc5fc2f1bcb9968fd40 —
# otherwise Android refuses to update over 5.6
# (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
#
# G-CI-5(d): FAIL if the secret is absent — never silently fall back to
# an ephemeral runner key.
#
# Runs on push to the flutter-yemen-6.0 branch and on workflow_dispatch.
# It does NOT publish to main or to Pages (that is a separate step).
name: Build Yemen app (Flutter)

on:
  push:
    branches: [flutter-yemen-6.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.35.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Require shared debug signing secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "REFUSED: DEBUG_KEYSTORE_BASE64 secret is absent — refusing to build with an ephemeral debug key (G-CI-5(d))." >&2
            exit 1
          fi

      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
          ls -l android/app/debug.keystore

      # --no-snapshot: the lab dashboard snapshot is NOT in the repo
      # (lab-only, never committed), so CI skips exactly the snapshot
      # comparisons and still runs every repo-self-contained check
      # (counts, app_keys, Aden counts, seed byte-identity, manifest).
      # The full check runs in the lab before any edge regeneration.
      - name: Verify Yemen data (edge contract)
        run: python3 edge/verify_yemen.py --no-snapshot

      - name: Analyze + test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify identity (package / version)
        run: |
          AAPT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep -E "package:|application-label"

      # The update-safety invariant: the v6 APK must carry the exact 5.6
      # signing certificate, or Android refuses to update over 5.6.
      - name: Verify signing certificate fingerprint
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk
          FPRINT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | grep "SHA-256 digest" | awk '{print $NF}')
          echo "fingerprint=$FPRINT"
          if [ "$FPRINT" != "45220b1509e14db5fd9a8e42220547ea94da48bdc4a4ccc5fc2f1bcb9968fd40" ]; then
            echo "REFUSED: certificate fingerprint does not match the 5.6 shared debug keystore." >&2
            exit 1
          fi

      - name: Upload fat debug APK (all ABIs, verification only)
        uses: actions/upload-artifact@v4
        with:
          name: eco-journal-yemen-v6-apk-fat
          path: build/app/outputs/flutter-apk/app-debug.apk

      # SERVED APK: arm64-only. The fat debug APK is 138 MB — GitHub
      # rejects any file over 100 MB, so it can never be committed to
      # edge/out/ for Pages to serve (push rejected 2026-11-19). The
      # arm64-only build is the same app, same version, same signing
      # certificate, ~45-50 MB. Limitation: it installs only on arm64
      # devices (all modern phones, including the user's). The fat APK
      # above stays the all-ABI verification build.
      # NOTE: --split-per-abi, not --target-platform: a second
      # --target-platform build in the same build dir re-packages the
      # fat build's stale ABIs (run 44421823161: still 144,693,592 B).
      # The split build writes a genuinely arm64-only APK.
      - name: Build served debug APK (arm64 only)
        run: flutter build apk --debug --split-per-abi

      - name: Verify served APK identity + signing
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          AAPT="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)/apksigner"
          "$AAPT" dump badging "$APK" | grep -E "package:|application-label"
          "$APKSIGNER" verify --print-certs "$APK"
          FPRINT=$("$APKSIGNER" verify --print-certs "$APK" | grep "SHA-256 digest" | awk '{print $NF}')
          if [ "$FPRINT" != "45220b1509e14db5fd9a8e42220547ea94da48bdc4a4ccc5fc2f1bcb9968fd40" ]; then
            echo "REFUSED: served APK certificate fingerprint does not match the 5.6 shared debug keystore." >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "served apk size bytes=$SIZE"
          if [ "$SIZE" -ge 104857600 ]; then
            echo "REFUSED: served APK is $SIZE bytes (>= 100 MB GitHub file limit)." >&2
            exit 1
          fi

      # version.json is generated ONLY by edge/version_manifest.py, from
      # the real SERVED (arm64) APK and the version in pubspec.yaml
      # (single source of truth). Identity-only verify here: two builds
      # from the same source are not byte-identical, so the hash is
      # checked against the COMMITTED APK when it lands, not against
      # this fresh build.
      - name: Generate + verify version.json (identity only)
        run: |
          python3 edge/version_manifest.py generate \
            --apk build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            --apk-url https://syfazel.github.io/eco-journal-app/app-debug-v6.0.apk \
            --changelog "نسخهٔ ۶٫۰ (بازسازی کامل با فلاتر): فقط یمن — نقشهٔ درگیری، جبهه‌ها، بررسی عدن، پرونده‌ها، گاه‌شمار و آرشیو. بدون پیام‌رسانی و بدون کد دعوت. رفع یخ‌زدگی تب یمن: همهٔ کارهای شبکه و پردازش داده خارج از نخ اصلی انجام می‌شود." \
            --mandatory \
            --out version-6.0.json
          python3 edge/version_manifest.py verify \
            --apk build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk \
            --manifest version-6.0.json --identity-only

      - name: Upload served debug APK (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: eco-journal-yemen-v6-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

      - name: Upload generated version.json
        uses: actions/upload-artifact@v4
        with:
          name: eco-journal-yemen-v6-version-json
          path: version-6.0.json
